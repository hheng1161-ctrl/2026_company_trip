<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <meta name="description" content="2026 宇宙科技公司員工旅遊活動資訊與報名表。瀏覽一日行程並完成線上報名。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff8ef'/%3E%3Ccircle cx='45' cy='21' r='8' fill='%23ffd166'/%3E%3Cpath d='M6 50 L24 21 L38 42 L46 31 L58 50 Z' fill='%23f27065'/%3E%3C/svg%3E">

  <!-- 社群分享預覽（LINE / Facebook / Slack 等） -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:site_name" content="宇宙科技公司員工旅遊">
  <meta property="og:title" content="2026 宇宙科技公司員工旅遊｜活動名單與報名">
  <meta property="og:description" content="一日行程：湖光山色、主題分享與分組體驗。填寫報名表即可完成線上報名。">
  <meta property="og:url" content="https://hheng1161-ctrl.github.io/2026_company_trip/">
  <meta property="og:image" content="https://hheng1161-ctrl.github.io/2026_company_trip/cover.jpg">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="2026 宇宙科技公司員工旅遊主視覺：湖光山色與遊湖船">
  <meta name="twitter:card" content="summary_large_image">

  <title>2026 宇宙科技公司員工旅遊</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #23334d;
      background: #fff8ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #23334d;
      --muted: #64748b;
      --coral: #f27065;
      --yellow: #ffd166;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 12%, rgb(255 209 102 / 22%), transparent 29rem),
        radial-gradient(ellipse at 92% 34%, rgb(111 199 221 / 20%), transparent 25rem),
        #fff8ef;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .event-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 0 4px 22px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #e36a56;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.7rem, 4vw, 2.8rem);
      line-height: 1.25;
      letter-spacing: .02em;
    }

    .heading-sticker {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 2px solid #f4bf57;
      border-radius: 999px;
      background: #fff3c9;
      color: #77551a;
      font-size: .9rem;
      font-weight: 800;
      transform: rotate(3deg);
    }

    .hero {
      overflow: hidden;
      border: 7px solid var(--paper);
      border-radius: 28px;
      background: #e5eef5;
      box-shadow: 0 18px 42px rgb(35 51 77 / 12%);
    }

    .hero img {
      display: block;
      width: 100%;
      height: clamp(190px, 24vw, 280px);
      object-fit: cover;
      object-position: center 22%;
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
      margin-top: 30px;
    }

    .card {
      border: 1px solid rgb(35 51 77 / 7%);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 12px 30px rgb(35 51 77 / 7%);
    }

    .schedule-card {
      padding: 28px;
      background: linear-gradient(180deg, #edf8ff 0 76px, #fff 76px);
    }

    .form-card {
      background: linear-gradient(180deg, #fff0f2 0 76px, #fff 76px);
    }

    .section-kicker {
      margin: 0 0 7px;
      color: #e36a56;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
    }

    h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.55rem;
    }

    .schedule-intro {
      margin: 9px 0 23px;
      color: var(--muted);
      line-height: 1.7;
    }

    .schedule {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .schedule li {
      position: relative;
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 14px;
      min-height: 68px;
      padding: 0 0 14px;
    }

    .schedule li:not(:last-child)::before {
      position: absolute;
      top: 24px;
      bottom: 0;
      left: 31px;
      width: 2px;
      background: #fce4c7;
      content: "";
    }

    .time {
      z-index: 1;
      align-self: start;
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff0dd;
      color: #9b592d;
      font-size: .83rem;
      font-weight: 800;
      text-align: center;
    }

    .schedule-copy {
      display: grid;
      gap: 3px;
      padding-top: 3px;
    }

    .schedule-copy strong { color: #23334d; }

    .schedule-copy span {
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.5;
    }

    .form-card { padding: 28px; }

    .form-copy {
      margin: 8px 0 20px;
      color: var(--muted);
      line-height: 1.65;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field { display: grid; gap: 7px; }
    .field-wide { grid-column: 1 / -1; }

    label {
      color: #34445d;
      font-size: .9rem;
      font-weight: 700;
    }

    .required { color: #df594f; }

    input {
      width: 100%;
      min-height: 47px;
      padding: 10px 13px;
      border: 1px solid #dce3eb;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #ef967e;
      box-shadow: 0 0 0 3px rgb(242 112 101 / 16%);
    }

    input::placeholder { color: #9aa5b4; }

    .submit-button {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(100deg, #f27065, #f49b5c);
      box-shadow: 0 8px 18px rgb(242 112 101 / 25%);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .15s, opacity .15s;
    }

    .submit-button:hover { transform: translateY(-1px); }
    .submit-button:disabled { cursor: wait; opacity: .7; }

    .form-status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
    }

    .form-status[data-state="error"] { color: #b42318; }
    .form-status[data-state="success"] { color: #18764a; }

    .website-field {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    footer {
      padding-top: 24px;
      color: #7a8798;
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 28px, 600px); padding-top: 25px; }
      .event-heading { align-items: start; }
      .heading-sticker { margin-top: 4px; font-size: .78rem; }
      .hero img { height: clamp(190px, 38vw, 240px); object-position: center 22%; }
      .main-grid { grid-template-columns: 1fr; gap: 18px; margin-top: 20px; }
      .hero { border-width: 5px; border-radius: 20px; }
      .schedule-card, .form-card { padding: 23px; }
    }

    @media (max-width: 440px) {
      .page { width: calc(100% - 22px); }
      .event-heading { display: block; }
      .heading-sticker { display: inline-block; margin-top: 14px; }
      .fields { grid-template-columns: 1fr; gap: 13px; }
      .field-wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="event-heading">
      <div>
        <p class="eyebrow">宇宙科技公司 · 一起出發</p>
        <h1>活動名單：2026 宇宙科技公司員工旅遊</h1>
      </div>
      <span class="heading-sticker">2026 一日行程</span>
    </header>

    <section class="hero" aria-label="活動圖片">
      <img src="./cover.jpg" alt="2026 宇宙科技公司員工旅遊，湖光山色與旅遊行程主視覺">
    </section>

    <div class="main-grid">
      <section class="card schedule-card" aria-labelledby="schedule-title">
        <p class="section-kicker">TRIP PLAN</p>
        <h2 id="schedule-title">活動內容</h2>
        <p class="schedule-intro">留一天給風景、好心情，還有一起出發的我們。</p>
        <ol class="schedule">
          <li><span class="time">8:00</span><span class="schedule-copy"><strong>報到</strong><span>集合報到，領取活動資料</span></span></li>
          <li><span class="time">9:00</span><span class="schedule-copy"><strong>場次一</strong><span>主題分享與交流</span></span></li>
          <li><span class="time">10:00</span><span class="schedule-copy"><strong>Break time</strong><span>茶點時間，放鬆一下</span></span></li>
          <li><span class="time">10:30</span><span class="schedule-copy"><strong>場次二</strong><span>分組活動與體驗</span></span></li>
          <li><span class="time">11:30</span><span class="schedule-copy"><strong>Q&amp;A</strong><span>問題討論、經驗分享</span></span></li>
          <li><span class="time">12:00</span><span class="schedule-copy"><strong>活動結束</strong><span>合影留念，滿載而歸</span></span></li>
        </ol>
      </section>

      <section class="card form-card" aria-labelledby="form-title">
        <p class="section-kicker">SAVE YOUR SEAT</p>
        <h2 id="form-title">活動報名</h2>
        <p class="form-copy">填寫以下資料完成報名，標示 <span class="required">*</span> 為必填。</p>
        <form id="registration-form">
          <div class="fields">
            <div class="field">
              <label for="name">姓名 <span class="required">*</span></label>
              <input id="name" name="name" autocomplete="name" required maxlength="100" placeholder="請輸入姓名">
            </div>
            <div class="field">
              <label for="email">Email <span class="required">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com">
            </div>
            <div class="field">
              <label for="phone">電話 <span class="required">*</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="30" placeholder="請輸入聯絡電話">
            </div>
            <div class="field">
              <label for="department">單位</label>
              <input id="department" name="department" autocomplete="organization" maxlength="100" placeholder="例如：產品部">
            </div>
            <div class="field field-wide">
              <label for="title">職稱</label>
              <input id="title" name="title" autocomplete="organization-title" maxlength="100" placeholder="例如：專案經理">
            </div>
          </div>
          <div class="website-field" aria-hidden="true">
            <label for="website">Leave this field empty</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button class="submit-button" type="submit">送出報名</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
    <footer>期待和你一起出發！</footer>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJLyAr2hgwotx99kGveEbFcBjxQe-hRzVnl43-TqlLNVNRNBaXg3Ic7w_6pgtf-GA6/exec";
    const form = document.querySelector("#registration-form");
    const submitButton = form.querySelector("button[type='submit']");
    const status = document.querySelector("#form-status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.dataset.state = "";

      if (!SCRIPT_URL) {
        status.textContent = "報名表單尚未連結 Google Sheet，請先完成 Apps Script 部署設定。";
        status.dataset.state = "error";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "送出中…";
      status.textContent = "";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams(new FormData(form))
        });
        if (response.type !== "opaque" && !response.ok) {
          if (response.status === 401 || response.status === 403) {
            throw new Error("Google Apps Script 拒絕存取（401/403）。請將部署的存取權限設為「任何人」，再更新部署。");
          }
          throw new Error("報名資料未能送出，請稍後再試。");
        }
        // no-cors 只能確認請求已送出，無法讀取回應（實際寫入結果由主辦人在試算表確認）。
        // 頁面文案以使用者感受為主；技術限制寫在 README 給主辦人看。
        status.textContent = "已送出報名！主辦人會再確認並與你聯繫。";
        status.dataset.state = "success";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "連線失敗，請檢查網路後再試。";
        status.dataset.state = "error";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "送出報名";
      }
    });
  </script>
</body>
</html>
